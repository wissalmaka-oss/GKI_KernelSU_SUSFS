name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf), then applies pinned SukiSU KPM KernelPatch'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        sed -i 's/check_defconfig//' ./common/build.config.gki

        if [ -f "build/build.sh" ]; then
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          CC="/usr/bin/ccache clang" \
          CXX="/usr/bin/ccache clang++" \
          HOSTCC="/usr/bin/ccache clang" \
          HOSTCXX="/usr/bin/ccache clang++" \
          build/build.sh -j"$(nproc)"
        else
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          tools/bazel build \
            --config=fast \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image
        fi

    - name: 'Apply SukiSU KPM KernelPatch'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Pinned official SukiSU KernelPatch release.
        # GitHub release 0.13.0 currently resolves to commit 762e6fb...
        KPM_VERSION="0.13.0"
        KPM_EXPECTED_COMMIT_PREFIX="762e6fb"
        KPM_REPO="https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch.git"
        KPM_URL="https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/${KPM_VERSION}/patch_linux"

        # Locate the exact Image produced by the build step.
        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          IMAGE_PATH="$(realpath "bazel-bin/common/kernel_aarch64/Image")"
        elif [ -f "/home/runner/out/dist/Image" ]; then
          IMAGE_PATH="/home/runner/out/dist/Image"
        else
          echo "::error::Kernel Image not found; refusing to continue without KPM patching."
          exit 1
        fi

        echo "Kernel Image: $IMAGE_PATH"

        # Verify that the pinned tag still points at the expected release commit.
        TAG_SHA="$(git ls-remote "$KPM_REPO" "refs/tags/${KPM_VERSION}^{}" | awk 'NR==1 {print $1}')"
        if [ -z "$TAG_SHA" ]; then
          TAG_SHA="$(git ls-remote "$KPM_REPO" "refs/tags/${KPM_VERSION}" | awk 'NR==1 {print $1}')"
        fi

        if [ -z "$TAG_SHA" ]; then
          echo "::error::Unable to resolve SukiSU KernelPatch tag ${KPM_VERSION}."
          exit 1
        fi

        if [[ "$TAG_SHA" != "${KPM_EXPECTED_COMMIT_PREFIX}"* ]]; then
          echo "::error::KernelPatch tag ${KPM_VERSION} moved or no longer matches the pinned commit."
          echo "Expected prefix: ${KPM_EXPECTED_COMMIT_PREFIX}"
          echo "Actual commit:   ${TAG_SHA}"
          exit 1
        fi

        PATCH_DIR="${RUNNER_TEMP}/sukisu-kernelpatch-${KPM_VERSION}"
        PATCH_BIN="${PATCH_DIR}/patch_linux"
        rm -rf "$PATCH_DIR"
        mkdir -p "$PATCH_DIR"

        echo "Downloading pinned SukiSU KernelPatch ${KPM_VERSION}..."
        curl \
          --fail \
          --location \
          --show-error \
          --silent \
          --retry 5 \
          --retry-delay 2 \
          --retry-all-errors \
          "$KPM_URL" \
          -o "$PATCH_BIN"

        if [ ! -s "$PATCH_BIN" ]; then
          echo "::error::Downloaded patch_linux is missing or empty."
          exit 1
        fi

        chmod 0755 "$PATCH_BIN"
        PATCH_SHA256="$(sha256sum "$PATCH_BIN" | awk '{print $1}')"
        echo "patch_linux SHA256: $PATCH_SHA256"

        BEFORE_SHA256="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
        BEFORE_SIZE="$(stat -c '%s' "$IMAGE_PATH")"
        IMAGE_DIR="$(dirname "$IMAGE_PATH")"
        IMAGE_NAME="$(basename "$IMAGE_PATH")"
        PATCH_LOG="${PATCH_DIR}/patch_linux.log"

        echo "Unpatched Image SHA256: $BEFORE_SHA256"
        echo "Unpatched Image size:   $BEFORE_SIZE"

        # patch_linux expects an input file named Image and writes oImage.
        rm -f "${IMAGE_DIR}/oImage"
        (
          cd "$IMAGE_DIR"
          "$PATCH_BIN" 2>&1 | tee "$PATCH_LOG"
        )

        if [ ! -s "${IMAGE_DIR}/oImage" ]; then
          echo "::error::KernelPatch did not produce a non-empty oImage."
          exit 1
        fi

        # Hard failure if the patcher returned an unchanged image.
        if cmp -s "$IMAGE_PATH" "${IMAGE_DIR}/oImage"; then
          echo "::error::oImage is byte-for-byte identical to the original Image; KPM patch was not applied."
          exit 1
        fi

        mv -f "${IMAGE_DIR}/oImage" "$IMAGE_PATH"

        AFTER_SHA256="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
        AFTER_SIZE="$(stat -c '%s' "$IMAGE_PATH")"

        if [ "$BEFORE_SHA256" = "$AFTER_SHA256" ]; then
          echo "::error::Final Image SHA256 did not change after KernelPatch."
          exit 1
        fi

        echo "Patched Image SHA256:   $AFTER_SHA256"
        echo "Patched Image size:     $AFTER_SIZE"
        echo "KPM KernelPatch applied successfully."

        # Persist the exact patched Image path/hash so the artifact step cannot
        # accidentally copy the original unpatched Image.
        echo "KPM_PATCHED_IMAGE=$IMAGE_PATH" >> "$GITHUB_ENV"
        echo "KPM_PATCHED_SHA256=$AFTER_SHA256" >> "$GITHUB_ENV"
        echo "KPM_PATCH_VERSION=$KPM_VERSION" >> "$GITHUB_ENV"
        echo "KPM_PATCH_COMMIT=$TAG_SHA" >> "$GITHUB_ENV"
        echo "KPM_PATCH_BINARY_SHA256=$PATCH_SHA256" >> "$GITHUB_ENV"

        {
          echo "### SukiSU KPM KernelPatch"
          echo "- Version: ${KPM_VERSION}"
          echo "- Commit: ${TAG_SHA}"
          echo "- patch_linux SHA256: ${PATCH_SHA256}"
          echo "- Image SHA256 before: ${BEFORE_SHA256}"
          echo "- Image SHA256 after: ${AFTER_SHA256}"
          echo "- Image size before: ${BEFORE_SIZE}"
          echo "- Image size after: ${AFTER_SIZE}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [ -z "${KPM_PATCHED_IMAGE:-}" ]; then
          echo "::error::KPM_PATCHED_IMAGE is not set. Refusing to package an unverified kernel."
          exit 1
        fi

        if [ ! -s "$KPM_PATCHED_IMAGE" ]; then
          echo "::error::Verified KPM-patched Image is missing or empty: $KPM_PATCHED_IMAGE"
          exit 1
        fi

        CURRENT_SHA256="$(sha256sum "$KPM_PATCHED_IMAGE" | awk '{print $1}')"
        if [ "$CURRENT_SHA256" != "${KPM_PATCHED_SHA256:-}" ]; then
          echo "::error::Kernel Image changed after KPM validation."
          echo "Expected: ${KPM_PATCHED_SHA256:-missing}"
          echo "Actual:   $CURRENT_SHA256"
          exit 1
        fi

        mkdir -p "${{ github.workspace }}/AnyKernel3"
        cp "$KPM_PATCHED_IMAGE" "${{ github.workspace }}/AnyKernel3/Image"

        PACKAGED_SHA256="$(sha256sum "${{ github.workspace }}/AnyKernel3/Image" | awk '{print $1}')"
        if [ "$PACKAGED_SHA256" != "$KPM_PATCHED_SHA256" ]; then
          echo "::error::Packaged AnyKernel3/Image does not match the verified KPM-patched Image."
          exit 1
        fi

        echo "Verified KPM-patched Image copied to AnyKernel3."
        echo "Final AnyKernel3/Image SHA256: $PACKAGED_SHA256"
